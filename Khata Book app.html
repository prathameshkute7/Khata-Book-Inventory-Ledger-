<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khata Book with Excel Upload</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<!-- SheetJS Library Excel file read karne ke liye -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#F6F8FC; --panel:#FFFFFF; --rule:#D9E3F1; --rule-strong:#B7C6DC;
  --ink:#1B2942; --ink-soft:#586883; --margin:#C8323C;
  --owe:#B3261E; --ok:#1B7A4B; --accent:#1F3C88; --accent-ink:#FFFFFF;
  --warn-bg:#FFF3D6; --warn-ink:#6B4A00; --row-hover:#EEF3FB;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11151E; --panel:#1A2030; --rule:#283149; --rule-strong:#3A4665;
    --ink:#E7ECF6; --ink-soft:#97A4BC; --margin:#E5535C;
    --owe:#FF8F86; --ok:#6FD3A0; --accent:#8FAAFF; --accent-ink:#0F1730;
    --warn-bg:#3A2F12; --warn-ink:#F2D58A; --row-hover:#212A40;
  }
}
:root[data-theme="dark"]{
  --paper:#11151E; --panel:#1A2030; --rule:#283149; --rule-strong:#3A4665;
  --ink:#E7ECF6; --ink-soft:#97A4BC; --margin:#E5535C;
  --owe:#FF8F86; --ok:#6FD3A0; --accent:#8FAAFF; --accent-ink:#0F1730;
  --warn-bg:#3A2F12; --warn-ink:#F2D58A; --row-hover:#212A40;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Hind','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Baloo 2','Hind',system-ui,sans-serif;margin:0;line-height:1.2;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;border-bottom:2px solid var(--margin);background:var(--panel)}
.brand{display:flex;flex-direction:column;margin-right:auto}
.brand h1{font-size:1.7rem}
.brand span{font-size:.85rem;color:var(--ink-soft)}
.month{display:flex;align-items:center;gap:6px}
.month .label{min-width:9.5em;text-align:center;font-family:'Baloo 2','Hind',sans-serif;font-weight:600;font-size:1.1rem}
.btn{border:1px solid var(--rule-strong);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:500;min-height:40px;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--row-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--owe)}
.btn.small{padding:4px 10px;min-height:32px;font-size:.9rem}
.btn.icon{width:40px;padding:0;font-size:1.2rem;line-height:1}

.warn{background:var(--warn-bg);color:var(--warn-ink);padding:8px 20px;font-size:.92rem}

/* layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);align-items:start}
aside{border-right:1px solid var(--rule);background:var(--panel);min-height:calc(100vh - 80px);padding:14px 0;display:flex;flex-direction:column;}
.search{margin:0 14px 10px;width:calc(100% - 28px);padding:9px 12px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--paper)}
.clist{list-style:none;margin:0;padding:0}
.clist button{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 16px;border-left:4px solid transparent}
.clist button:hover{background:var(--row-hover)}
.clist button[aria-current="true"]{background:var(--row-hover);border-left-color:var(--margin);font-weight:600}
.clist .amt{font-variant-numeric:tabular-nums;font-size:.95rem}
.owe{color:var(--owe)} .ok{color:var(--ok)} .soft{color:var(--ink-soft)}
.side-empty{padding:14px 16px;color:var(--ink-soft);font-size:.92rem}

main{padding:22px clamp(14px,3vw,32px) 60px;min-width:0}

/* ledger page */
.page{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:22px 22px 28px clamp(48px,7vw,84px);box-shadow:0 1px 0 var(--rule)}
.page::before,.page::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--margin);opacity:.85}
.page::before{left:clamp(30px,5vw,58px)}
.page::after{left:calc(clamp(30px,5vw,58px) + 5px);width:1px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 16px;margin-bottom:16px}
.page-head .who{margin-right:auto}
.page-head h2{font-size:1.7rem}
.page-head .phone{color:var(--ink-soft);margin:0;font-size:.95rem}
.back{display:none}

.sum{margin:0 0 26px;max-width:460px}
.sum .r{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid var(--rule)}
.sum dt{color:var(--ink-soft)}
.sum dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500}
.sum .total{border-bottom:2px solid var(--ink);border-top:2px solid var(--ink);padding:10px 0;margin-top:6px}
.sum .total dt{color:var(--ink);font-weight:600;font-family:'Baloo 2','Hind',sans-serif;font-size:1.1rem}
.sum .total dd{font-size:1.5rem;font-family:'Baloo 2','Hind',sans-serif;font-weight:700}

.sec-title{font-size:1.15rem;margin:26px 0 8px}
.scroll{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;min-width:520px}
th{font-weight:600;font-size:.88rem;color:var(--ink-soft);text-align:left;padding:8px 10px;border-bottom:2px solid var(--rule-strong);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
td .sub{display:block;color:var(--ink-soft);font-size:.85rem}
tfoot td{font-weight:600;border-top:2px solid var(--rule-strong);border-bottom:0}
tr.pay td.jama{color:var(--ok);font-weight:600}
tr.buy td.udhaar{color:var(--owe)}
.xbtn{background:none;border:0;color:var(--ink-soft);font-size:1.1rem;padding:2px 8px;border-radius:6px}
.xbtn:hover{color:var(--owe);background:var(--row-hover)}
.empty{padding:18px 4px;color:var(--ink-soft)}

/* overview */
.ov-head{display:flex;flex-wrap:wrap;gap:14px 34px;align-items:flex-end;margin-bottom:16px}
.ov-head h2{font-size:1.5rem;margin-right:auto}
.fig{display:flex;flex-direction:column}
.fig span{font-size:.85rem;color:var(--ink-soft)}
.fig b{font-family:'Baloo 2','Hind',sans-serif;font-size:1.35rem;font-variant-numeric:tabular-nums}
.ovt tbody tr{cursor:pointer}
.ovt tbody tr:hover{background:var(--row-hover)}
.linkbtn{background:none;border:0;padding:0;font-weight:600;text-align:left;color:var(--ink)}
.ovt-wrap{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px 10px 8px}

/* forms */
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:8px}
.fbox{border:1px solid var(--rule);border-radius:6px;padding:14px;background:var(--paper)}
.fbox h3{font-size:1.05rem;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:10px;min-width:0}
.field label{font-size:.85rem;color:var(--ink-soft)}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--panel);min-height:40px}
.field.wide{grid-column:1 / -1}
.hint{font-size:.85rem;color:var(--ink-soft);margin:0 0 10px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,15,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.sheet{background:var(--panel);border-radius:10px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;border:1px solid var(--rule-strong)}
.sheet h3{font-size:1.3rem;margin-bottom:12px}
.sheet p{margin:0 0 12px}
.sheet textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;padding:8px;border:1px solid var(--rule-strong);border-radius:8px;background:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100% - 24px)}
.toast button{background:none;border:0;color:inherit;font-weight:600;text-decoration:underline;padding:0}
.hidden{display:none !important}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{display:none}
  .hide-sm{display:none}
  table{min-width:0}
  .back{display:inline-flex}
  body.has-sel .ov{display:none}
  .top{padding:12px 14px}
  .brand h1{font-size:1.4rem}
  .page{padding:16px 14px 22px 46px}
}

@media (prefers-reduced-motion:no-preference){ .toast{animation:pop .18s ease-out} @keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Khata Book</h1><span>Shop credit ledger</span></div>
  <div class="month" role="group" aria-label="Choose month">
    <button class="btn icon" data-a="prevMonth" aria-label="Previous month">‹</button>
    <div class="label" id="monthLabel" aria-live="polite"></div>
    <button class="btn icon" data-a="nextMonth" aria-label="Next month">›</button>
    <button class="btn small" data-a="thisMonth">This month</button>
  </div>
  <div>
    <button class="btn primary" data-a="addCust">+ New customer</button>
    <label class="btn" style="cursor:pointer; display:inline-flex; align-items:center; margin-left:5px;">
      📁 Upload Excel <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" style="display:none;" onchange="handleExcelUpload(event)">
    </label>
    <button class="btn" data-a="backup">Backup</button>
  </div>
</header>
<div id="warn" class="warn hidden"></div>
<div class="layout">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
  function logoutUser() {
    localStorage.removeItem('isLoggedIn');
    window.location.href = 'login.html';
  }

  // Check if user is logged in, else redirect to login page
  if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = 'login.html';
  }

  // Default Products aur unke Rates
  let productRates = {
      'Rice': 60,
      'Flour (Atta)': 40,
      'Sugar': 45,
      'Dal': 120,
      'Oil': 140,
      'Salt': 20,
      'Tea': 250,
      'Soap': 30
  };

  // Excel file handle karne ka function
  function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
          try {
              const data = new Uint8Array(e.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              const jsonRows = XLSX.utils.sheet_to_json(worksheet);
              
              if (jsonRows.length === 0) {
                  alert("Excel file khali hai!");
                  return;
              }

              let addedCustCount = 0;
              let addedProdCount = 0;

              jsonRows.forEach(row => {
                  let type = row['Type'] || row['type'] || '';
                  let name = row['Customer Name'] || row['Name'] || row['name'] || row['CUSTOMER'] || '';
                  let phone = row['Phone Number'] || row['Phone'] || row['phone'] || row['MOBILE'] || '';
                  
                  let prodName = row['Product Name'] || row['Product'] || row['product'] || '';
                  let rate = row['Rate'] || row['rate'] || 0;

                  if (String(type).toLowerCase() === 'customer' || name) {
                      let cName = String(name).trim();
                      if (cName && cName !== '-' && !store.customers.some(c => c.name.toLowerCase() === cName.toLowerCase())) {
                          store.customers.push({
                              id: uid(),
                              name: cName,
                              phone: String(phone).trim() === '-' ? '' : String(phone).trim()
                          });
                          addedCustCount++;
                      }
                  }

                  if (String(type).toLowerCase() === 'product' || prodName) {
                      let pName = String(prodName).trim();
                      let pRate = parseFloat(rate);
                      if (pName && pName !== '-' && isFinite(pRate)) {
                          productRates[pName] = pRate;
                          addedProdCount++;
                      }
                  }
              });

              save();
              renderAll();
              alert(`Success! ${addedCustCount} customers aur ${addedProdCount} products sheet se update ho gaye hain.`);
          } catch (err) {
              console.error(err);
              alert("Excel file read karne me error aayi.");
          }
          event.target.value = '';
      };
      reader.readAsArrayBuffer(file);
  }

  (function(){
  'use strict';
  var KEY='khata-book-v1';
  var storageOK=true;
  var store=load();
  var ui={month:'2026-09',sel:null,q:''};
  var lastRemoved=null,toastTimer=null;

  function load(){
    try{
      var r=localStorage.getItem(KEY);
      if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.customers)&&Array.isArray(d.entries))return d;}
    }catch(e){storageOK=false;}
    return {customers:[],entries:[]};
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){storageOK=false;}
    renderWarn();
  }
  window.store = store;
  window.save = save;
  window.renderAll = function() { renderTop(); renderSide(); renderMain(); };

  function pad(n){return String(n).padStart(2,'0');}
  function todayStr(){return '2026-09-29';}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  window.uid = uid;
  function r2(n){return Math.round(n*100)/100;}
  function fmt(n){return '₹'+r2(n).toLocaleString('en-IN',{maximumFractionDigits:2});}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function monthLabel(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});}
  function shiftMonth(m,d){var p=m.split('-').map(Number);var dt=new Date(p[0],p[1]-1+d,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1);}
  function lastDay(m){var p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate();}
  function fmtDate(s){var p=s.split('-').map(Number);return p[2]+' '+new Date(p[0],p[1]-1,p[2]).toLocaleDateString('en-IN',{month:'short'});}
  function defaultDate(){var t=todayStr();return t.slice(0,7)===ui.month?t:ui.month+'-01';}
  function $(id){return document.getElementById(id);}
  function custById(id){for(var i=0;i<store.customers.length;i++){if(store.customers[i].id===id)return store.customers[i];}return null;}

  function stats(cid,m){
    var start=m+'-01',prev=0,buys=0,pays=0,nb=0;
    store.entries.forEach(function(e){
      if(e.cid!==cid)return;
      if(e.date<start){prev+=(e.type==='buy'?e.amount:-e.amount);}
      else if(e.date.slice(0,7)===m){if(e.type==='buy'){buys+=e.amount;nb++;}else{pays+=e.amount;}}
    });
    prev=r2(prev);buys=r2(buys);pays=r2(pays);
    return {prev:prev,buys:buys,pays:pays,nb:nb,bal:r2(prev+buys-pays)};
  }
  function balClass(b){return b>0?'owe':(b<0?'ok':'soft');}
  function balText(b){return b<0?fmt(-b)+' advance':fmt(b);}

  function renderWarn(){
    var w=$('warn');
    if(storageOK){w.classList.add('hidden');return;}
    w.classList.remove('hidden');
    w.textContent='This browser cannot save your data, so it will be lost when you close the page. Use Backup to copy your data.';
  }
  function renderTop(){$('monthLabel').textContent=monthLabel(ui.month);}

  function renderSide(){
    var q=ui.q.trim().toLowerCase();
    var list=store.customers.slice().sort(function(a,b){return a.name.localeCompare(b.name);})
      .filter(function(c){return !q||c.name.toLowerCase().indexOf(q)>-1;});
    var h='<input class="search" id="q" type="search" placeholder="Search customer" aria-label="Search customer" value="'+esc(ui.q)+'">';
    if(!store.customers.length){h+='<div class="side-empty">No customers yet. Upload Excel or add new customers.</div>';}
    else if(!list.length){h+='<div class="side-empty">No customer found.</div>';}
    else{
      h+='<ul class="clist">';
      list.forEach(function(c){
        var s=stats(c.id,ui.month);
        h+='<li><button data-a="select" data-id="'+c.id+'" aria-current="'+(ui.sel===c.id)+'"><span>'+esc(c.name)+'</span><span class="amt '+balClass(s.bal)+'">'+fmt(Math.abs(s.bal))+'</span></button></li>';
      });
      h+='</ul>';
    }
    var keep=document.activeElement&&document.activeElement.id==='q';
    var pos=keep?document.activeElement.selectionStart:0;
    
    // Single clean logout button at the bottom of the sidebar
    var logoutBtnHtml = '<div style="margin-top: auto; padding: 10px 14px;"><button onclick="logoutUser()" style="width: 100%; padding: 8px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem;">Logout</button></div>';

    $('side').innerHTML = h + logoutBtnHtml;
    if(keep){var qi=$('q');qi.focus();try{qi.setSelectionRange(pos,pos);}catch(e){}}
  }

  function renderMain(){
    document.body.classList.toggle('has-sel',!!(ui.sel&&custById(ui.sel)));
    if(ui.sel&&custById(ui.sel)){$('main').innerHTML=detailHTML(custById(ui.sel));}
    else{ui.sel=null;$('main').innerHTML=overviewHTML();}
  }

  function overviewHTML(){
    if(!store.customers.length){
      return '<div class="ov"><div class="page"><h2>Get started</h2><p class="soft" style="max-width:34em">Add your regular customers or upload an Excel file containing customer names and phone numbers. Then record items and payments.</p><p><button class="btn primary" data-a="addCust">+ New customer</button> <button class="btn" data-a="demo">Load demo data</button></p></div></div>';
    }
    var rows=store.customers.map(function(c){return {c:c,s:stats(c.id,ui.month)};})
      .sort(function(a,b){return b.s.bal-a.s.bal||a.c.name.localeCompare(b.c.name);});
    var T={prev:0,buys:0,pays:0,bal:0};
    rows.forEach(function(r){T.prev+=r.s.prev;T.buys+=r.s.buys;T.pays+=r.s.pays;T.bal+=r.s.bal;});
    var owing=rows.filter(function(r){return r.s.bal>0;}).length;
    var h='<div class="ov"><div class="ov-head"><h2>'+esc(monthLabel(ui.month))+' summary</h2>'
      +'<div class="fig"><span>Sales on credit this month</span><b>'+fmt(T.buys)+'</b></div>'
      +'<div class="fig"><span>Payments received this month</span><b class="ok">'+fmt(T.pays)+'</b></div>'
      +'<div class="fig"><span>Total pending</span><b class="owe">'+fmt(T.bal)+'</b></div></div>'
      +'<div class="ovt-wrap"><div class="scroll"><table class="ovt"><thead><tr><th>Customer</th><th class="r hide-sm">Previous balance</th><th class="r hide-sm">This month\'s purchases</th><th class="r hide-sm">Payments</th><th class="r">Balance due</th></tr></thead><tbody>';
    rows.forEach(function(r){
      h+='<tr data-a="select" data-id="'+r.c.id+'"><td><button class="linkbtn" data-a="select" data-id="'+r.c.id+'">'+esc(r.c.name)+'</button>'+(r.c.phone?'<span class="sub">'+esc(r.c.phone)+'</span>':'')+'</td>'
        +'<td class="r hide-sm">'+fmt(r.s.prev)+'</td><td class="r hide-sm">'+fmt(r.s.buys)+'</td><td class="r hide-sm">'+fmt(r.s.pays)+'</td>'
        +'<td class="r '+balClass(r.s.bal)+'"><b>'+balText(r.s.bal)+'</b></td></tr>';
    });
    h+='</tbody><tfoot><tr><td>Total ('+owing+' '+(owing===1?'customer owes':'customers owe')+' money)</td><td class="r hide-sm">'+fmt(T.prev)+'</td><td class="r hide-sm">'+fmt(T.buys)+'</td><td class="r hide-sm">'+fmt(T.pays)+'</td><td class="r">'+fmt(T.bal)+'</td></tr></tfoot></table></div></div>'
      +'<p class="hint" style="margin-top:12px">Click a customer to see their full account: items, rates and payments.</p></div>';
    return h;
  }

  function detailHTML(c){
    var s=stats(c.id,ui.month);
    var ents=store.entries.filter(function(e){return e.cid===c.id&&e.date.slice(0,7)===ui.month;})
      .map(function(e,i){return {e:e,i:i};})
      .sort(function(a,b){return a.e.date<b.e.date?-1:a.e.date>b.e.date?1:a.i-b.i;})
      .map(function(x){return x.e;});
    var items={};
    ents.forEach(function(e){if(e.type!=='buy')return;var k=e.item.trim().toLowerCase();if(!items[k])items[k]={name:e.item.trim(),n:0,amt:0};items[k].n++;items[k].amt+=e.amount;});
    var itemList=Object.keys(items).map(function(k){return items[k];}).sort(function(a,b){return b.amt-a.amt;});
    
    var allItemsSet = new Set(Object.keys(productRates));
    store.entries.forEach(function(e){if(e.type==='buy'&&e.item)allItemsSet.add(e.item.trim());});
    var productOptions = Array.from(allItemsSet).map(function(p){ return '<option value="'+esc(p)+'">'+esc(p)+'</option>'; }).join('');

    var h='<div class="page">';
    h+='<button class="btn small back" data-a="back" style="margin-bottom: 15px;">‹ Back to list</button>';
    h+='<div class="page-head"><button class="btn small back" data-a="back">‹ All customers</button>'
      +'<div class="who"><h2>'+esc(c.name)+'</h2><p class="phone">'+(c.phone?esc(c.phone):'No phone number')+'</p></div>'
      +'<button class="btn small" data-a="editCust">Edit customer</button><button class="btn small danger" data-a="delCust">Delete customer</button></div>';

    h+='<dl class="sum">'
      +'<div class="r"><dt>Previous balance (from earlier months)</dt><dd>'+fmt(s.prev)+'</dd></div>'
      +'<div class="r"><dt>+ Purchases this month ('+s.nb+(s.nb===1?' time':' times')+')</dt><dd>'+fmt(s.buys)+'</dd></div>'
      +'<div class="r"><dt>− Payments received</dt><dd class="ok">'+fmt(s.pays)+'</dd></div>'
      +'<div class="r total"><dt>'+(s.bal<0?'Advance paid':'Balance due')+'</dt><dd class="'+balClass(s.bal)+'">'+fmt(Math.abs(s.bal))+'</dd></div></dl>';

    h+='<h3 class="sec-title">'+esc(monthLabel(ui.month))+' entries</h3>';
    if(!ents.length){h+='<div class="empty">No entries this month. Add a purchase or a payment below.</div>';}
    else{
      h+='<div class="scroll"><table><thead><tr><th>Date</th><th>Item / details</th><th class="r">Credit</th><th class="r">Paid</th><th></th></tr></thead><tbody>';
      ents.forEach(function(e){
        if(e.type==='buy'){
          var det=(e.qty?e.qty+' '+esc(e.unit||''):'')+(e.qty&&e.rate?' × '+fmt(e.rate):'');
          h+='<tr class="buy"><td>'+fmtDate(e.date)+'</td><td>'+esc(e.item)+(det?'<span class="sub">'+det+'</span>':'')+'</td><td class="r udhaar">'+fmt(e.amount)+'</td><td class="r"></td>';
        }else{
          h+='<tr class="pay"><td>'+fmtDate(e.date)+'</td><td>Payment received'+(e.note?'<span class="sub">'+esc(e.note)+'</span>':'')+'</td><td class="r"></td><td class="r jama">'+fmt(e.amount)+'</td>';
        }
        h+='<td class="r"><button class="xbtn" data-a="delEntry" data-id="'+e.id+'" aria-label="Delete entry">✕</button></td></tr>';
      });
      h+='</tbody><tfoot><tr><td></td><td>Month total</td><td class="r">'+fmt(s.buys)+'</td><td class="r">'+fmt(s.pays)+'</td><td></td></tr></tfoot></table></div>';
    }

    if(itemList.length){
      h+='<h3 class="sec-title">Items bought ('+itemList.length+' different '+(itemList.length===1?'item':'items')+')</h3><div class="scroll"><table><thead><tr><th>Item</th><th class="r">Times</th><th class="r">Amount</th></tr></thead><tbody>';
      itemList.forEach(function(it){h+='<tr><td>'+esc(it.name)+'</td><td class="r">'+it.n+'</td><td class="r">'+fmt(it.amt)+'</td></tr>';});
      h+='</tbody></table></div>';
    }

    var d=defaultDate(),mn=ui.month+'-01',mx=ui.month+'-'+pad(lastDay(ui.month));
    var initialProduct = Object.keys(productRates)[0] || '';
    var initialRate = productRates[initialProduct] || 0;

    h+='<h3 class="sec-title">Add an entry</h3><div class="forms">'
      +'<div class="fbox" data-enter="addBuy"><h3>Add purchase (on credit)</h3><div class="grid2">'
      +'<div class="field"><label for="b_date">Date</label><input id="b_date" type="date" value="'+d+'" min="'+mn+'" max="'+mx+'"></div>'
      +'<div class="field"><label for="b_item">Item name</label><select id="b_item"><option value="">-- Select Product --</option>'+productOptions+'</select></div>'
      +'<div class="field"><label for="b_qty">Quantity</label><input id="b_qty" type="number" inputmode="decimal" min="0" step="any" value="1" placeholder="1"></div>'
      +'<div class="field"><label for="b_unit">Unit</label><select id="b_unit"><option>kg</option><option>gram</option><option>litre</option><option>packet</option><option>piece</option><option>dozen</option></select></div>'
      +'<div class="field"><label for="b_rate">Rate (₹ per unit)</label><input id="b_rate" type="number" inputmode="decimal" min="0" step="any" value="'+initialRate+'" placeholder="60"></div>'
      +'<div class="field"><label for="b_amt">Amount (₹)</label><input id="b_amt" type="number" inputmode="decimal" min="0" step="any" value="'+initialRate+'" placeholder="120"></div></div>'
      +'<p class="hint">Item select karte hi sheet ke hisaab se rate aur amount automatic aa jayega.</p>'
      +'<div id="b_err" class="owe" role="alert"></div><button class="btn primary" data-a="addBuy">Add purchase</button></div>'
      +'<div class="fbox" data-enter="addPay"><h3>Payment received</h3><div class="grid2">'
      +'<div class="field"><label for="p_date">Date</label><input id="p_date" type="date" value="'+d+'" min="'+mn+'" max="'+mx+'"></div>'
      +'<div class="field"><label for="p_amt">Amount received (₹)</label><input id="p_amt" type="number" inputmode="decimal" min="0" step="any" placeholder="500"></div>'
      +'<div class="field wide"><label for="p_note">Note (cash / UPI, optional)</label><input id="p_note" autocomplete="off" placeholder="e.g. UPI"></div></div>'
      +'<div id="p_err" class="owe" role="alert"></div><button class="btn primary" data-a="addPay">Save payment</button></div></div></div>';
    return h;
  }

  function openModal(html){
    $('modalRoot').innerHTML='<div class="scrim" data-a="closeModal"><div class="sheet" role="dialog" aria-modal="true">'+html+'</div></div>';
    var f=$('modalRoot').querySelector('input,textarea,button');if(f)f.focus();
  }
  function closeModal(){$('modalRoot').innerHTML='';}
  function toast(msg,undo){
    clearTimeout(toastTimer);
    $('toastRoot').innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(undo?'<button data-a="undo">Undo</button>':'')+'</div>';
    toastTimer=setTimeout(function(){$('toastRoot').innerHTML='';lastRemoved=null;},6000);
  }
  function custModal(c){
    openModal('<h3>'+(c?'Edit customer':'New customer')+'</h3><div data-enter="saveCust">'
      +'<div class="field"><label for="c_name">Name</label><input id="c_name" autocomplete="off" value="'+esc(c?c.name:'')+'"></div>'
      +'<div class="field"><label for="c_phone">Phone (optional)</label><input id="c_phone" type="tel" autocomplete="off" value="'+esc(c?c.phone||'':'')+'"></div>'
      +'<div id="c_err" class="owe" role="alert"></div></div>'
      +'<div class="actions"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="saveCust" data-id="'+(c?c.id:'')+'">Save</button></div>');
  }
  function confirmModal(title,text,label,action,id){
    openModal('<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="actions"><button class="btn" data-a="closeModal">Cancel</button><button class="btn primary" data-a="'+action+'" data-id="'+(id||'')+'">'+esc(label)+'</button></div>');
  }

  var actions={
    prevMonth:function(){ui.month=shiftMonth(ui.month,-1);renderAll();},
    nextMonth:function(){
      var next = shiftMonth(ui.month, 1);
      if (next <= "2026-09") {
        ui.month = next;
        renderAll();
      } else {
        alert("Future months (beyond September 2026) are not available.");
      }
    },
    thisMonth:function(){
      ui.month = "2026-09";
      renderAll();
    },
    select:function(t){ui.sel=t.dataset.id;renderSide();renderMain();window.scrollTo(0,0);},
    back:function(){ui.sel=null;renderAll();window.scrollTo(0,0);},
    addCust:function(){custModal(null);},
    editCust:function(){custModal(custById(ui.sel));},
    saveCust:function(t){
      var name=$('c_name').value.trim(),phone=$('c_phone').value.trim();
      if(!name){$('c_err').textContent='Name is required.';return;}
      var id=t?t.dataset.id:'';
      if(id){var c=custById(id);c.name=name;c.phone=phone;}
      else{var n={id:uid(),name:name,phone:phone};store.customers.push(n);ui.sel=n.id;}
      save();closeModal();renderAll();
    },
    delCust:function(){var c=custById(ui.sel);if(c)confirmModal('Delete '+c.name+'?','All of this customer\'s entries will be permanently removed.','Yes, delete','doDelCust',c.id);},
    doDelCust:function(t){
      var id=t.dataset.id;
      store.customers=store.customers.filter(function(c){return c.id!==id;});
      store.entries=store.entries.filter(function(e){return e.cid!==id;});
      ui.sel=null;save();closeModal();renderAll();
    },
    addBuy:function(){
      var date=$('b_date').value,item=$('b_item').value,qty=num('b_qty'),rate=num('b_rate'),amt=num('b_amt');
      if(!date){$('b_err').textContent='Choose a date.';return;}
      if(!item){$('b_err').textContent='Please select an item.';return;}
      if(!(amt>0)&&qty>0&&rate>0)amt=r2(qty*rate);
      if(!(amt>0)){$('b_err').textContent='Enter an amount (or a quantity and rate).';return;}
      store.entries.push({id:uid(),cid:ui.sel,type:'buy',date:date,item:item,qty:qty||0,unit:$('b_unit').value,rate:rate||0,amount:r2(amt)});
      if(date.slice(0,7)!==ui.month)ui.month=date.slice(0,7);
      save();renderAll();toast(item+' — '+fmt(amt)+' added');
    },
    addPay:function(){
      var date=$('p_date').value,amt=num('p_amt');
      if(!date){$('p_err').textContent='Choose a date.';return;}
      if(!(amt>0)){$('p_err').textContent='Enter the amount received.';return;}
      store.entries.push({id:uid(),cid:ui.sel,type:'pay',date:date,note:$('p_note').value.trim(),amount:r2(amt)});
      if(date.slice(0,7)!==ui.month)ui.month=date.slice(0,7);
      save();renderAll();toast(fmt(amt)+' payment saved');
    },
    delEntry:function(t){
      var id=t.dataset.id,idx=-1;
      store.entries.forEach(function(e,i){if(e.id===id)idx=i;});
      if(idx<0)return;
      lastRemoved={entry:store.entries[idx],idx:idx};
      store.entries.splice(idx,1);save();renderAll();toast('Entry deleted',true);
    },
    undo:function(){
      if(!lastRemoved)return;
      store.entries.splice(Math.min(lastRemoved.idx,store.entries.length),0,lastRemoved.entry);
      lastRemoved=null;save();renderAll();$('toastRoot').innerHTML='';
    },
    backup:function(){
      openModal('<h3>Backup and restore</h3>'
        +'<p class="soft">Your data is saved only in this browser on this phone or computer. Copy the text below and keep it safe. To move to a new device, paste it here and restore.</p>'
        +'<textarea id="bk" aria-label="Backup data">'+esc(JSON.stringify(store))+'</textarea><div id="bk_msg" class="soft" role="status" style="margin-top:6px"></div>'
        +'<div class="actions"><button class="btn danger" data-a="wipe">Delete all data</button><button class="btn" data-a="copyBk">Copy</button><button class="btn primary" data-a="restore">Restore from this text</button><button class="btn" data-a="closeModal">Close</button></div>');
    },
    copyBk:function(){
      var ta=$('bk');ta.select();
      var done=function(){$('bk_msg').textContent='Copied.';};
      var fail=function(){try{document.execCommand('copy');done();}catch(e){$('bk_msg').textContent='The text is selected. Please copy it manually.';}};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done,fail);}else{fail();}
    },
    restore:function(){
      try{
        var d=JSON.parse($('bk').value);
        if(!d||!Array.isArray(d.customers)||!Array.isArray(d.entries))throw new Error('bad');
        var cs=d.customers.filter(function(c){return c&&c.id&&typeof c.name==='string';}).map(function(c){return {id:String(c.id),name:c.name,phone:String(c.phone||'')};});
        var ids={};cs.forEach(function(c){ids[c.id]=1;});
        var es=d.entries.filter(function(e){return e&&ids[e.cid]&&(e.type==='buy'||e.type==='pay')&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&isFinite(e.amount)&&e.amount>0;})
          .map(function(e){return {id:String(e.id||uid()),cid:e.cid,type:e.type,date:e.date,item:String(e.item||''),qty:Number(e.qty)||0,unit:String(e.unit||''),rate:Number(e.rate||0),note:String(e.note||''),amount:Number(e.amount)};});
        store={customers:cs,entries:es};ui.sel=null;save();closeModal();renderAll();toast('Data restored');
      }catch(e){$('bk_msg').textContent='That does not look like a valid backup. Paste the full backup text.';}
    },
    wipe:function(){confirmModal('Delete all data?','All customers and entries will be permanently removed. Take a backup first.','Yes, delete everything','doWipe');},
    doWipe:function(){store={customers:[],entries:[]};ui.sel=null;save();closeModal();renderAll();},
    demo:function(){
      var m="2026-09",pm="2026-08";
      var names=[['Ramesh Kumar','9811111111'],['Sunita Sharma','9822222222'],['Amit Verma','9833333333'],['Pooja Gupta','9844444444']];
      names.forEach(function(n,i){
        var id=uid();store.customers.push({id:id,name:n[0],phone:n[1]});
        store.entries.push({id:uid(),cid:id,type:'buy',date:pm+'-12',item:'Rice',qty:5,unit:'kg',rate:60,note:'',amount:300});
        store.entries.push({id:uid(),cid:id,type:'buy',date:m+'-03',item:'Flour (Atta)',qty:10,unit:'kg',rate:40,note:'',amount:400});
        if(i%2===0)store.entries.push({id:uid(),cid:id,type:'pay',date:m+'-09',item:'',qty:0,unit:'',rate:0,note:'UPI',amount:300});
      });
      save();renderAll();toast('Demo data loaded.');
    },
    closeModal:function(t,e){if(e.target===t)closeModal();}
  };

  function num(id){var v=parseFloat($(id).value);return isFinite(v)?v:0;}

  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-a]');
    if(!t)return;
    var fn=actions[t.dataset.a];
    if(fn)fn(t,e);
  });
  document.addEventListener('keydown',function(e){
    e.key==='Escape'&&$('modalRoot').firstChild&&closeModal();
    if(e.key!=='Enter'||e.target.tagName==='TEXTAREA'||e.target.tagName==='BUTTON')return;
    var box=e.target.closest('[data-enter]');
    if(box){e.preventDefault();var a=box.dataset.enter,b=box.querySelector('[data-a="'+a+'"]')||document.querySelector('#modalRoot [data-a="'+a+'"]');actions[a](b,e);}
  });
  document.addEventListener('input',function(e){
    var id=e.target.id;
    if(id==='q'){ui.q=e.target.value;renderSide();}
    
    if(id==='b_item'){
      var selectedItem = e.target.value;
      var rate = productRates[selectedItem] || 0;
      $('b_rate').value = rate;
      var q = parseFloat($('b_qty').value) || 1;
      $('b_amt').value = r2(q * rate);
    }
    
    if(id==='b_qty' || id==='b_rate'){
      var q = parseFloat($('b_qty').value) || 0;
      var r = parseFloat($('b_rate').value) || 0;
      if(q >= 0 && r >= 0) {
        $('b_amt').value = r2(q * r);
      }
    }
  });

  try{localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');}catch(e){storageOK=false;}
  renderWarn();
  renderAll();
  })();
  </script>
</body>
</html>
